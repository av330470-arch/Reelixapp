name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Prepare Project & Fix minSdkVersion
      run: |
        flutter create --org com.example --project-name instagram_reels_clone .
        # Auto-fix minSdkVersion for AdMob (Set 21)
        sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
        sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle || true
        flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reelix-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
