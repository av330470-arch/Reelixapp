name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android & Flutter Project Structure
        run: |
          mkdir -p /tmp/backup_lib
          if [ -d "lib" ]; then cp -r lib/* /tmp/backup_lib/ 2>/dev/null || true; fi
          rm -f pubspec.yaml
          flutter create . --project-name instagram_reels_clone --platforms=android --org com.example.instagram_reels --overwrite
          if [ -d "/tmp/backup_lib" ]; then cp -r /tmp/backup_lib/* lib/ 2>/dev/null || true; fi

      - name: Write Clean pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
name: instagram_reels_clone
description: "Instagram Reels clone app"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  video_player: ^2.8.2
  google_mobile_ads: ^5.0.0
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
EOF

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Reels-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
