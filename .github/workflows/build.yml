name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Re-generate Android Files
        run: flutter create --platforms=android --project-name=reelixapp .

      - name: Safely Inject Permissions & AdMob ID into AndroidManifest.xml
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest_path)
          root = tree.getroot()

          # Permissions
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE"
          ]
          for perm in permissions:
              if not root.find(f"./uses-permission[@android:name=\"{perm}\"]", {"android": "http://schemas.android.com/apk/res/android"}):
                  elem = ET.Element("uses-permission", {"{http://schemas.android.com/apk/res/android}name": perm})
                  root.insert(0, elem)

          # Application Tag Meta Data
          app = root.find("application")
          if app is not None:
              meta = ET.Element("meta-data", {
                  "{http://schemas.android.com/apk/res/android}name": "com.google.android.gms.ads.APPLICATION_ID",
                  "{http://schemas.android.com/apk/res/android}value": "ca-app-pub-3940256099942544~3347511713"
              })
              app.append(meta)

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          '

      - name: Fix Compatibility & Gradle Settings
        run: |
          sed -i 's/gradle-.*-bin.zip/gradle-7.6.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/com.android.application" version ".*"/com.android.application" version "7.4.2"/g' android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.8.20"/g' android/settings.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reelix-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
