name: instagram_reels_clone
description: "A complete Instagram Reels clone Flutter application with video auto-play, vertical scrolling, and interactive engagement overlay UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Video playback engine with loop mode support
  video_player: ^2.8.2

  # Cupertino icons for iOS / Instagram style icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
